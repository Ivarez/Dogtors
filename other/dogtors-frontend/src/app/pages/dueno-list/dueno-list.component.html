<div class="dueno-list-page">
  <div class="container">
    <!-- Header -->
    <div class="page-header">
      <div>
        <div class="eyebrow">GESTIÓN HOSPITALARIA</div>
        <h1>Directorio de Clientes</h1>
        <p class="subtitle">Propietarios registrados y responsables de los pacientes del hospital.</p>
      </div>
      <div>
        <a routerLink="/duenos/nuevo" class="btn-primary">+ Registrar Propietario</a>
      </div>
    </div>

    <!-- Barra de búsqueda por cédula, nombre o correo -->
    <div class="search-toolbar">
      <div class="search-input-wrap">
        <span class="search-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </span>
        <input
          type="search"
          [(ngModel)]="filtroBusqueda"
          placeholder="Buscar propietario por cédula, nombre, celular o correo..."
          class="search-input"
          aria-label="Buscar propietario por cédula, nombre, celular o correo" />
      </div>
    </div>

    @if (errorMsg) {
      <div class="alert-error">
        <span>{{ errorMsg }}</span>
      </div>
    }

    @if (cargando) {
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Cargando lista de propietarios...</p>
      </div>
    } @else {
      <section class="table-section">
        <div class="section-title-row">
          <h2>
            Propietarios
            <span class="count-badge">{{ duenosFiltrados.length }}</span>
          </h2>
        </div>

        <app-dueno-table
          [duenoArray]="duenosFiltrados"
          (duenoEliminado)="eliminarDueno($event)">
        </app-dueno-table>
      </section>
    }
  </div>
</div>
