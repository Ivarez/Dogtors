<div class="dashboard-page">
  <div class="container">
    <!-- Encabezado del Portal del Administrador -->
    <header class="page-header">
      <div class="header-left">
        <div class="eyebrow">PORTAL ADMINISTRATIVO</div>
        <h1>Dashboard General</h1>
        <p class="subtitle">
          Indicadores operativos, clínicos y financieros de la clínica veterinaria.
        </p>
      </div>
      <div class="header-actions">
        <button type="button" class="btn-refresh" (click)="cargarDashboard()">
          ↻ Actualizar
        </button>
        <a routerLink="/admin/veterinarios/nuevo" class="btn-primary">
          + Registrar Veterinario
        </a>
      </div>
    </header>

    @if (cargando) {
      <div class="loading-box">
        <div class="spinner"></div>
        <p>Calculando indicadores de la veterinaria...</p>
      </div>
    } @else if (errorMsg) {
      <div class="error-banner">
        <span>{{ errorMsg }}</span>
        <button type="button" class="btn-retry" (click)="cargarDashboard()">Reintentar</button>
      </div>
    } @else {
      <!-- Componente hijo 1: Tarjetas de KPIs (layout balanceado 3 + 2) -->
      <app-kpi-cards [kpis]="kpis"></app-kpi-cards>

      <!-- Componente hijo 2: Tablas de Top 3 tratamientos y Tratamientos por medicamento -->
      <app-top-treatments
        [topTratamientos]="top3Tratamientos"
        [tratamientosPorMedicamento]="tratamientosPorMedicamento">
      </app-top-treatments>
    }
  </div>
</div>
