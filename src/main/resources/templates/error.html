<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error — Dogtors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { dark: '#264653', teal: '#2A9D8F', mustard: '#E9C46A', lightbg: '#F9FAFB' },
            fontFamily: { sans: ['Inter', 'sans-serif'], outfit: ['Outfit', 'sans-serif'] }
          }
        }
      }
    </script>
</head>
<body class="bg-lightbg min-h-screen flex flex-col items-center justify-center font-sans text-dark">

    <div class="text-center max-w-lg mx-auto px-6">
        <div class="text-8xl mb-6">⚠️</div>
        <h1 class="text-4xl font-bold font-outfit text-dark mb-4">Error</h1>
        <p class="text-lg text-gray-600 mb-8" th:text="${mensaje}">Ha ocurrido un error inesperado.</p>
        <a th:href="@{/}" class="inline-block bg-mustard text-dark font-bold px-8 py-3 rounded-xl hover:bg-yellow-400 transition-colors">
            Volver al Inicio
        </a>
    </div>

</body>
</html>
