<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pacientes Hospitalizados — Portal Veterinario</title>
    <!-- Bootstrap 5.3 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #F9FAFB; font-family: 'Inter', sans-serif; color: #264653; }
        h1, h2, h3, .brand-name { font-family: 'Outfit', sans-serif; }
        
        /* Navbar */
        .navbar-custom { background-color: #FFFFFF; border-bottom: 1px solid #F3F4F6; padding: 16px 32px; }
        .logo-mark { width: 36px; height: 36px; background-color: rgba(42,157,143,0.1); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #2A9D8F; }
        .brand-name { font-weight: 700; font-size: 1.4rem; color: #264653; margin-left: 10px; }
        .nav-link-custom { color: #4B5563; font-weight: 600; font-size: 0.9rem; padding: 8px 16px; text-decoration: none; }
        .nav-link-custom.active { color: #2A9D8F; border-bottom: 2px solid #E9C46A; }
        .btn-ingresar { background-color: #E9C46A; color: #264653; font-weight: 700; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.9rem; text-decoration: none;}
        .btn-ingresar:hover { opacity: 0.9; color: #264653; }

        /* Page Content */
        .page-title { font-size: 2.5rem; font-weight: 700; color: #264653; margin-top: 40px; margin-bottom: 8px; letter-spacing: -0.02em; }
        .page-subtitle { color: #6B7280; font-size: 1rem; margin-bottom: 40px; }
        
        .search-bar { background-color: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 12px; padding: 10px 16px; width: 300px; display: flex; align-items: center; gap: 8px; }
        .search-bar input { border: none; outline: none; background: transparent; width: 100%; font-size: 0.9rem; color: #374151; }
        
        /* Table Styles */
        .table-container { background-color: #FFFFFF; border-radius: 16px; padding: 10px; border: 1px solid #F3F4F6; }
        .table-custom { margin-bottom: 0; }
        .table-custom th { border-bottom: 1px solid #F3F4F6; color: #4B5563; font-weight: 700; font-size: 0.75rem; text-transform: uppercase; padding: 16px 24px; letter-spacing: 0.05em; background-color: #F9FAFB; }
        .table-custom td { padding: 20px 24px; vertical-align: middle; border-bottom: 1px solid #F3F4F6; }
        .table-custom tbody tr:last-child td { border-bottom: none; }
        .table-custom tbody tr:hover { background-color: #F9FAFB; }
        
        .patient-cell { display: flex; align-items: center; gap: 16px; }
        .avatar { width: 44px; height: 44px; border-radius: 50%; background-color: #E6F4F1; color: #2A9D8F; display: flex; align-items: center; justify-content: center; font-weight: bold; overflow: hidden;}
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .patient-name { font-weight: 600; color: #264653; margin: 0; font-size: 0.95rem; }
        .patient-meta { color: #6B7280; font-size: 0.8rem; margin: 0; }
        
        .owner-name { color: #4B5563; font-size: 0.9rem; }
        .reason-text { color: #4B5563; font-size: 0.9rem; }
        
        .status-badge { display: inline-block; padding: 6px 12px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
        .status-stable { background-color: #E6F4F1; color: #2A9D8F; }
        .status-critical { background-color: #FEE2E2; color: #DC2626; }
        
        .action-link { color: #2A9D8F; font-weight: 500; font-size: 0.9rem; text-decoration: none; padding: 8px 16px; border: 1px solid #E6F4F1; border-radius: 8px; transition: all 0.2s;}
        .action-link:hover { background-color: #E6F4F1; }
        
        .table-footer { padding: 16px 24px; color: #6B7280; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #F3F4F6; }

        /* Bootstrap overrides */
        .container-custom { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="navbar-custom d-flex justify-content-between align-items-center shadow-sm">
        <a th:href="@{/}" class="d-flex align-items-center text-decoration-none">
            <span class="brand-name">Dogtors <span class="badge text-bg-light text-secondary ms-2" style="font-family: Inter;">Portal Veterinario</span></span>
        </a>
        <nav class="d-none d-md-flex gap-4">
            <a th:href="@{/}" class="nav-link-custom">Inicio</a>
            <a th:href="@{/mascotas}" class="nav-link-custom active">Pacientes</a>
            <a th:href="@{/duenos/lista}" class="nav-link-custom">Dueños</a>
        </nav>
        <a th:href="@{/mascotas/nueva}" class="btn-ingresar text-decoration-none">+ Registrar Ingreso</a>
    </header>

    <!-- Main Content -->
    <main class="container-custom pb-5">
        
        <div class="d-flex justify-content-between align-items-end mb-4 mt-5">
            <div>
                <h1 class="page-title">Pacientes Hospitalizados</h1>
                <p class="page-subtitle">Listado general del estado clínico de todas las mascotas.</p>
            </div>
            <div class="search-bar mb-4">
                <input type="text" placeholder="Buscar paciente o dueño...">
            </div>
        </div>

        <div class="table-container shadow-sm">
            <table class="table table-custom table-borderless align-middle">
                <thead>
                    <tr>
                        <th>PACIENTE</th>
                        <th>ESPECIE / RAZA</th>
                        <th>DUEÑO</th>
                        <th>DIAGNÓSTICO</th>
                        <th>ESTADO</th>
                        <th class="text-end">ACCIÓN</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="mascota : ${mascotas}">
                        <td>
                            <div class="patient-cell">
                                <div class="avatar">
                                    <img th:if="${mascota.fotoUrl != null and !mascota.fotoUrl.isEmpty()}" th:src="${mascota.fotoUrl}" alt="Foto">
                                    <span th:unless="${mascota.fotoUrl != null and !mascota.fotoUrl.isEmpty()}">🐾</span>
                                </div>
                                <div>
                                    <p class="patient-name" th:text="${mascota.nombre}"></p>
                                    <p class="patient-meta" th:text="${mascota.edad + ' Años, ' + mascota.peso + ' kg'}"></p>
                                </div>
                            </div>
                        </td>
                        <td>
                            <span class="reason-text" th:text="${mascota.especie + ' - ' + mascota.raza}"></span>
                        </td>
                        <td>
                            <span class="owner-name" th:text="${mascota.dueno != null ? mascota.dueno.nombre : 'Sin dueño'}"></span>
                        </td>
                        <td>
                            <span class="reason-text" th:text="${mascota.enfermedad}"></span>
                        </td>
                        <td>
                            <span th:if="${mascota.activa}" class="status-badge status-stable">● Estable</span>
                            <span th:unless="${mascota.activa}" class="status-badge status-critical">● Crítico</span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/mascotas/{id}(id=${mascota.id})}" class="action-link">Ver Expediente</a>
                        </td>
                    </tr>
                </tbody>
            </table>
            
            <div th:if="${mascotas == null or mascotas.isEmpty()}" class="p-5 text-center text-muted">
                No hay pacientes registrados en el sistema.
            </div>
        </div>

    </main>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
