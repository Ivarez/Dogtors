<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registro — Dogtors</title>
    <link rel="stylesheet" th:href="@{/index.css}">
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-[#F4F1DE] min-h-screen flex flex-col justify-between font-['Inter',sans-serif]">

    <!-- Navbar Superior -->
    <header class="w-full bg-white border-b border-gray-200 py-4 px-8 flex justify-between items-center">
      <a th:href="@{/}" class="flex items-center gap-2 font-bold text-xl text-[#264653]">
        <span class="text-2xl">🐶</span> Dogtors
      </a>
      <nav class="hidden md:flex gap-6 text-sm font-medium text-[#264653]">
        <a th:href="@{/}" class="hover:text-[#2A9D8F]">Inicio</a>
        <a th:href="@{/mascotas}" class="hover:text-[#2A9D8F]">Mascotas</a>
        <a href="#" class="hover:text-[#2A9D8F]">Tienda</a>
        <a href="#" class="hover:text-[#2A9D8F]">Adopciones</a>
        <a href="#" class="hover:text-[#2A9D8F]">Equipo</a>
      </nav>
      <a th:href="@{/duenos/login}" class="bg-[#E9C46A] text-[#264653] px-5 py-2 rounded-lg font-semibold shadow-sm hover:opacity-90">Ingresar</a>
    </header>

    <!-- Contenido Principal: Tarjeta de Registro Centrada -->
    <main class="flex-grow flex flex-col items-center justify-center px-4 py-12">
      
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold font-['Outfit'] text-[#264653] flex items-center justify-center gap-2">
          🐾 Dogtors
        </h1>
        <p class="text-sm text-gray-600 mt-1">Hospital Veterinario de Excelencia</p>
      </div>

      <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-xl border border-gray-100">
        <div class="text-center mb-6">
          <h2 class="text-2xl font-bold font-['Outfit'] text-[#264653]">Registro de Dueño</h2>
          <p class="text-xs text-gray-500 mt-1">Crea una cuenta para registrar a tu mascota.</p>
        </div>

        <form th:action="@{/duenos/nueva}" th:object="${dueno}" method="post" class="space-y-4">
          
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Nombre Completo</label>
            <input type="text" th:field="*{nombre}" placeholder="Tu nombre" required 
                   class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#2A9D8F]" />
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Correo Electrónico</label>
            <input type="email" th:field="*{correo}" placeholder="tu@correo.com" required 
                   class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#2A9D8F]" />
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Contraseña</label>
            <input type="password" th:field="*{password}" placeholder="••••••••" required 
                   class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#2A9D8F]" />
          </div>

          <button type="submit" class="w-full bg-[#E9C46A] text-[#264653] py-3 rounded-lg font-bold text-sm shadow-md hover:opacity-95 transition-all mt-2">
            Registrarse →
          </button>
        </form>

        <div class="text-center mt-6 text-xs text-gray-600">
          ¿Ya tienes una cuenta? <a th:href="@{/duenos/login}" class="text-[#2A9D8F] font-semibold hover:underline">Inicia sesión</a>
        </div>
      </div>
    </main>

    <footer class="w-full text-center py-6 text-xs text-gray-500">
      &copy; 2026 Dogtors Veterinary Hospital. Todos los derechos reservados.
    </footer>

  </body>
</html>
