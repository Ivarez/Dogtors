<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ingresar — Dogtors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bone: '#F4F1DE',
              dark: '#264653',
              teal: '#2A9D8F',
              mustard: '#E9C46A',
              lightbg: '#F9FAFB'
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              outfit: ['Outfit', 'sans-serif']
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-lightbg min-h-screen flex flex-col font-sans text-dark">

    <!-- Navbar Superior -->
    <header class="w-full bg-lightbg py-5 px-8 flex justify-between items-center">
      <a th:href="@{/}" class="flex items-center gap-2 font-bold text-2xl font-outfit text-dark">
        <div class="bg-teal/10 p-1.5 rounded-lg text-teal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg>
        </div>
        Dogtors
      </a>
      <nav class="hidden md:flex gap-8 text-sm font-semibold text-gray-600">
        <a th:href="@{/}" class="hover:text-dark">Inicio</a>
        <a th:href="@{/mascotas}" class="hover:text-dark">Mascotas</a>
        <a href="#" class="hover:text-dark">Tienda</a>
        <a href="#" class="hover:text-dark">Adopciones</a>
        <a href="#" class="hover:text-dark">Equipo</a>
      </nav>
      <a th:href="@{/duenos/login}" class="bg-mustard text-dark px-6 py-2.5 rounded-md font-semibold text-sm hover:bg-yellow-400 transition-colors">Ingresar</a>
    </header>

    <!-- Contenido Principal: Tarjeta de Login Centrada -->
    <main class="flex-grow flex flex-col items-center justify-center px-4 py-8">
      
      <!-- Logo Central del Portal -->
      <div class="text-center mb-8">
        <h1 class="text-4xl font-bold font-outfit text-dark flex items-center justify-center gap-2">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" class="text-dark"><path d="M12 2c-5.33 0-8 2.5-8 5.5v.16c.3-.09.62-.16.96-.16 2.22 0 4.04 1.82 4.04 4.04v.96h6v-.96c0-2.22 1.82-4.04 4.04-4.04.34 0 .66.07.96.16V7.5C20 4.5 17.33 2 12 2zm-5.5 8c-1.38 0-2.5 1.12-2.5 2.5s1.12 2.5 2.5 2.5 2.5-1.12 2.5-2.5-1.12-2.5-2.5-2.5zm11 0c-1.38 0-2.5 1.12-2.5 2.5s1.12 2.5 2.5 2.5 2.5-1.12 2.5-2.5-1.12-2.5-2.5-2.5zm-5.5 3c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5z"/></svg>
          Dogtors
        </h1>
        <p class="text-sm text-gray-600 mt-2">Hospital Veterinario de Excelencia</p>
      </div>

      <!-- Tarjeta Blanca de Autenticación -->
      <div class="bg-white w-full max-w-md p-10 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-gray-100">
        <div class="text-center mb-8">
          <h2 class="text-2xl font-bold font-outfit text-dark">Bienvenido</h2>
          <p class="text-sm text-gray-500 mt-1">Ingresa tus credenciales para acceder a tu portal.</p>
        </div>

        <div th:if="${error}" class="mb-5 p-3 bg-red-50 text-red-700 text-sm rounded-lg text-center font-medium border border-red-100">
          <span th:text="${error}"></span>
        </div>

        <form th:action="@{/duenos/login}" th:object="${dueno}" method="post" class="space-y-5">
          
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1.5 uppercase tracking-wide">Correo Electrónico</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              </div>
              <input type="email" th:field="*{correo}" placeholder="tu@correo.com" required 
                     class="w-full pl-10 pr-4 py-2.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:border-teal focus:ring-1 focus:ring-teal transition-colors" />
            </div>
          </div>

          <div>
            <div class="flex justify-between items-center mb-1.5">
              <label class="text-xs font-bold text-gray-700 uppercase tracking-wide">Contraseña</label>
              <a href="#" class="text-xs text-gray-500 hover:text-teal transition-colors">¿Olvidaste tu contraseña?</a>
            </div>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </div>
              <input type="password" th:field="*{password}" placeholder="••••••••" required 
                     class="w-full pl-10 pr-10 py-2.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:border-teal focus:ring-1 focus:ring-teal transition-colors" />
            </div>
          </div>

          <button type="submit" class="w-full bg-mustard text-dark py-3 rounded-lg font-bold text-sm hover:bg-yellow-400 transition-colors mt-2 flex justify-center items-center gap-2">
            Entrar 
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </form>

        <div class="mt-8 flex items-center justify-center">
          <div class="border-t border-gray-200 flex-grow"></div>
          <span class="px-3 text-xs text-gray-400 uppercase">O</span>
          <div class="border-t border-gray-200 flex-grow"></div>
        </div>

        <div class="text-center mt-6 text-sm text-gray-600">
          ¿No tienes una cuenta? <a th:href="@{/duenos/nueva}" class="text-dark font-bold hover:text-teal transition-colors">Regístrate</a>
        </div>
      </div>
    </main>

  </body>
</html>
