<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{fragmentos :: head(${mascota.id != null ? 'Editar Paciente' : 'Nuevo Ingreso Clínico'})}"></div>
    <!-- Select2 CSS for searchable owner dropdown -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <style>
        .select2-container .select2-selection--single {
            height: 44px !important;
            border-color: #DDE3DF !important;
            border-radius: 0.75rem !important;
            display: flex;
            align-items: center;
            background-color: #F7F8F5 !important;
        }
        .select2-container--default .select2-selection--single .select2-selection__rendered {
            color: #202522 !important;
            line-height: normal !important;
            padding-left: 0.85rem !important;
            font-size: 0.875rem !important;
        }
        .select2-container--default .select2-selection--single .select2-selection__arrow {
            height: 42px !important;
            right: 8px !important;
        }
        .select2-dropdown {
            border-color: #DDE3DF !important;
            border-radius: 0.75rem !important;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08) !important;
            font-size: 0.875rem !important;
        }
    </style>
</head>
<body class="bg-appbg text-dark font-sans antialiased min-h-screen flex flex-col">

    <!-- Shared Navbar -->
    <div th:replace="~{fragmentos :: navbar('mascotas')}"></div>

    <!-- Main Content -->
    <main class="flex-grow max-w-5xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-10">
        
        <!-- Page header -->
        <div class="mb-8 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
                <span class="text-xs font-bold text-secondary uppercase tracking-widest block mb-1">UNIDAD DE ADMISIÓN & TRIAJE</span>
                <h1 class="text-3xl sm:text-4xl font-outfit font-bold text-dark tracking-tight" 
                    th:text="${mascota.id != null ? 'Editar Expediente Clínico' : 'Registro de Ingreso Clínico'}">
                    Registro de Mascota
                </h1>
                <p class="mt-1 text-neutral text-sm">Filiación de paciente, datos biométricos y cuadro patológico.</p>
            </div>
            <div>
                <a th:href="@{/mascotas}" 
                   class="inline-flex items-center gap-2 px-4 py-2.5 border border-borders rounded-xl text-sm font-semibold text-neutral hover:text-dark hover:bg-surface transition-colors shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                    <span>Volver al Listado</span>
                </a>
            </div>
        </div>

        <form th:action="@{/mascotas/guardar}" th:object="${mascota}" method="post" class="space-y-8">
            <input type="hidden" th:field="*{id}">
            <input type="hidden" th:field="*{activa}">

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                
                <!-- Datos Generales -->
                <div class="bg-surface rounded-2xl shadow-sm border border-borders overflow-hidden">
                    <div class="bg-appbg/50 px-6 py-4 border-b border-borders flex items-center justify-between">
                        <h3 class="text-base font-outfit font-bold text-primary flex items-center gap-2">
                            <svg class="w-5 h-5 text-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                            <span>Filiación y Datos Generales</span>
                        </h3>
                        <span class="text-[11px] font-bold text-neutral uppercase tracking-wider">Fase 1</span>
                    </div>
                    <div class="p-6 space-y-5">
                        <!-- Owner Select (Searchable) -->
                        <div>
                            <label for="duenoId" class="block text-xs font-bold text-dark uppercase tracking-wider mb-1.5">Propietario / Responsable Legal *</label>
                            <select id="duenoId" name="duenoId" class="select2-dueno w-full" required>
                                <option value="">Buscar o seleccionar dueño...</option>
                                <option th:each="dueno : ${duenos}" 
                                        th:value="${dueno.id}" 
                                        th:text="${dueno.nombre + ' (' + dueno.correo + ')'}" 
                                        th:selected="${mascota.dueno != null and mascota.dueno.id == dueno.id}">
                                </option>
                            </select>
                        </div>

                        <!-- Nombre -->
                        <div>
                            <label for="nombre" class="block text-xs font-bold text-dark uppercase tracking-wider mb-1.5">Nombre del Paciente *</label>
                            <input type="text" id="nombre" th:field="*{nombre}" required 
                                   class="w-full rounded-xl border border-borders bg-appbg px-4 py-2.5 text-sm text-dark placeholder-neutral focus:bg-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" 
                                   placeholder="Ej. Max, Luna...">
                        </div>

                        <!-- Especie -->
                        <div>
                            <label for="especie" class="block text-xs font-bold text-dark uppercase tracking-wider mb-1.5">Especie *</label>
                            <input type="text" id="especie" th:field="*{especie}" required 
                                   class="w-full rounded-xl border border-borders bg-appbg px-4 py-2.5 text-sm text-dark placeholder-neutral focus:bg-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" 
                                   placeholder="Ej. Canino, Felino...">
                        </div>

                        <!-- Raza -->
                        <div>
                            <label for="raza" class="block text-xs font-bold text-dark uppercase tracking-wider mb-1.5">Raza</label>
                            <input type="text" id="raza" th:field="*{raza}" 
                                   class="w-full rounded-xl border border-borders bg-appbg px-4 py-2.5 text-sm text-dark placeholder-neutral focus:bg-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" 
                                   placeholder="Ej. Labrador, Angora...">
                        </div>
                    </div>
                </div>

                <!-- Detalles Clínicos -->
                <div class="bg-surface rounded-2xl shadow-sm border border-borders overflow-hidden">
                    <div class="bg-appbg/50 px-6 py-4 border-b border-borders flex items-center justify-between">
                        <h3 class="text-base font-outfit font-bold text-primary flex items-center gap-2">
                            <svg class="w-5 h-5 text-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                            </svg>
                            <span>Biometría & Diagnóstico</span>
                        </h3>
                        <span class="text-[11px] font-bold text-neutral uppercase tracking-wider">Fase 2</span>
                    </div>
                    <div class="p-6 space-y-5">
                        <div class="grid grid-cols-2 gap-4">
                            <!-- Edad -->
                            <div>
                                <label for="edad" class="block text-xs font-bold text-dark uppercase tracking-wider mb-1.5">Edad (años)</label>
                                <input type="number" step="1" id="edad" th:field="*{edad}" 
                                       class="w-full rounded-xl border border-borders bg-appbg px-4 py-2.5 text-sm text-dark focus:bg-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" 
                                       placeholder="Ej. 4">
                            </div>

                            <!-- Peso -->
                            <div>
                                <label for="peso" class="block text-xs font-bold text-dark uppercase tracking-wider mb-1.5">Peso (kg) *</label>
                                <input type="number" step="0.1" id="peso" th:field="*{peso}" required
                                       class="w-full rounded-xl border border-borders bg-appbg px-4 py-2.5 text-sm text-dark focus:bg-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" 
                                       placeholder="Ej. 14.5">
                            </div>
                        </div>

                        <!-- Condición / Diagnóstico -->
                        <div>
                            <label for="enfermedad" class="block text-xs font-bold text-dark uppercase tracking-wider mb-1.5">Motivo de Ingreso / Diagnóstico *</label>
                            <textarea id="enfermedad" th:field="*{enfermedad}" rows="3" required
                                      class="w-full rounded-xl border border-borders bg-appbg px-4 py-2.5 text-sm text-dark placeholder-neutral focus:bg-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all resize-none" 
                                      placeholder="Describa el cuadro clínico o patología de ingreso..."></textarea>
                        </div>

                        <!-- URL Foto -->
                        <div>
                            <label for="fotoUrl" class="block text-xs font-bold text-dark uppercase tracking-wider mb-1.5">URL Fotografía del Paciente</label>
                            <input type="url" id="fotoUrl" th:field="*{fotoUrl}" 
                                   class="w-full rounded-xl border border-borders bg-appbg px-4 py-2.5 text-sm text-dark placeholder-neutral focus:bg-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" 
                                   placeholder="https://images.unsplash.com/...">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Buttons -->
            <div class="flex items-center justify-end gap-3 pt-6 border-t border-borders">
                <a th:href="@{/mascotas}" 
                   class="px-6 py-3 border border-borders rounded-xl text-sm font-semibold text-neutral hover:bg-surface hover:text-dark transition-all">
                    Cancelar
                </a>
                <button type="submit" 
                        class="px-8 py-3 bg-primary text-white rounded-xl text-sm font-semibold hover:bg-primary/90 shadow-sm focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all">
                    Guardar Registro Clínico
                </button>
            </div>
        </form>
    </main>

    <!-- Shared Footer -->
    <div th:replace="~{fragmentos :: footer}"></div>

    <!-- jQuery & Select2 Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script>
        $(document).ready(function() {
            $('.select2-dueno').select2({
                placeholder: "Buscar o seleccionar dueño...",
                allowClear: true,
                language: {
                    noResults: function() {
                        return "No se encontraron dueños registrados";
                    }
                }
            });
        });
    </script>
</body>
</html>
